<script>
  S.calMonth=S.calMonth??7;S.calYear=S.calYear??2026;S.calSelected=S.calSelected??'2026-08-26';
  const calendarMemories={
    '2026-08-04':[{title:'Morning tea',duration:'10 min',image:'tea'}],
    '2026-08-08':[{title:'Evening walk',duration:'20 min',image:'walk'}],
    '2026-08-11':[{title:'Quiet reading',duration:'15 min',image:'light'}],
    '2026-08-15':[{title:'Nature break',duration:'15 min',image:'garden'}],
    '2026-08-19':[{title:'Creative reset',duration:'20 min',image:'golden'},{title:'Evening tea',duration:'10 min',image:'tea'}],
    '2026-08-22':[{title:'Sunset walk',duration:'25 min',image:'walk'}],
    '2026-08-26':[{title:'Slow bike ride',duration:'30 min',image:'bike'}]
  };
  function calendarMove(delta){S.calMonth+=delta;if(S.calMonth<0){S.calMonth=11;S.calYear--}if(S.calMonth>11){S.calMonth=0;S.calYear++}S.calSelected=null;render()}
  function calendarKey(day){return `${S.calYear}-${String(S.calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
  function calendarDays(){const days=new Date(S.calYear,S.calMonth+1,0).getDate(),first=(new Date(S.calYear,S.calMonth,1).getDay()+6)%7;let out=Array(first).fill('<span class="cal-day blank"></span>');for(let day=1;day<=days;day++){let key=calendarKey(day),items=calendarMemories[key],thumb=items?`<img src="${galleryAssets[items[0].image]}" alt="">`:'';out.push(`<button class="cal-day ${items?'has-memory':''} ${S.calSelected===key?'selected':''}" onclick="S.calSelected='${key}';render()">${thumb}<span>${day}</span></button>`)}return out.join('')}
  const renderBeforeCalendar=render;
  render=function(){
    if(S.screen!=='journal'||S.journal!=='calendar')return renderBeforeCalendar();
    const monthName=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(S.calYear,S.calMonth,1));
    const tabs=`<div class="tabs"><button onclick="S.journal='gallery';render()">Gallery</button><button class="on" onclick="S.journal='calendar';render()">Calendar</button><button onclick="S.journal='favorites';render()">Favorite</button></div>`;
    const items=S.calSelected?calendarMemories[S.calSelected]:null;
    const activityCard=item=>`<button class="cal-activity" onclick="openMemory('${item.image}','${item.title}','${S.calSelected}','${item.duration}')"><div class="cal-activity-copy"><h3>${item.title}</h3><p class="activity-date">${new Intl.DateTimeFormat('en-US',{day:'numeric',month:'long'}).format(new Date(S.calSelected+'T12:00:00'))}</p><p class="activity-duration">${item.duration}</p><span class="activity-action">View Activity&nbsp; ›</span></div><img src="${galleryAssets[item.image]}" alt="${item.title}"></button>`;
    const result=items?items.map(activityCard).join(''):`<div class="calendar-empty glass">No reset saved on this day.</div>`;
    $('#root').innerHTML=`<section class="journal-calendar"><div class="top"><span class="muted">01:24</span></div><div class="journal-mascot-scene" aria-hidden="true"><i class="journal-orbit journal-orbit-a"></i><i class="journal-orbit journal-orbit-b"></i><img class="journal-mascot" src="${journalMascots.calendar}" alt=""></div><span class="ey">to remember</span><h1>Reset Journal</h1><p class="copy journal-copy">Moments that bring you back to yourself.</p>${tabs}<div class="calendar-board"><div class="month-nav"><button aria-label="Previous month" onclick="calendarMove(-1)">‹</button><h3>${monthName}</h3><button aria-label="Next month" onclick="calendarMove(1)">›</button></div><div class="cal-week"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="cal-grid">${calendarDays()}</div></div><div class="calendar-result">${result}</div></section>${nav('journal')}`;
  };
  render();
</script>

<script>
  const renderBeforeResetFlow=render;
  function resetHead(back,count,step){
    const isThreeStepStage=/^[123] of 3$/.test(count);
    return `<div class="reset-top"><button class="reset-back" aria-label="Back" onclick="${back}">‹</button><span class="reset-count">${count}</span><span></span></div>${isThreeStepStage?`<div class="reset-progress"><i class="${step>=1?'on':''}"></i><i class="${step>=2?'on':''}"></i><i class="${step>=3?'on':''}"></i></div>`:''}`
  }
  function flowOption(label,icon,selected,click,trailingChevron=false){return `<button class="flow-option ${selected?'selected':''}" onclick="${click}">${icon?`<i>${icon}</i>`:''}<span>${label}</span>${trailingChevron?'<i class="flow-chevron" aria-hidden="true">›</i>':''}</button>`}
  function durationLabel(){
    const hours=Number(S.customHours||0),minutes=Number(S.customMinutes||0);
    return hours?`${hours} ${hours===1?'hour':'hours'}${minutes?` ${minutes} min`:''}`:`${minutes||15} min`;
  }
  function setDurationValue(unit,value){
    if(unit==='hours')S.customHours=Number(value);else S.customMinutes=Number(value);
    S.time=durationLabel();
    syncDurationWheels();
  }
  function updateDurationFromWheel(wheel,unit){
    const item=wheel.querySelector('.duration-wheel-item');
    if(!item)return;
    const index=Math.round(wheel.scrollTop/item.offsetHeight);
    const value=wheel.querySelectorAll('.duration-wheel-item')[index]?.dataset.value;
    if(value!==undefined){
      if(unit==='hours')S.customHours=Number(value);else S.customMinutes=Number(value);
      S.time=durationLabel();
      wheel.querySelectorAll('.duration-wheel-item').forEach((button,i)=>button.classList.toggle('active',i===index));
      const summary=document.querySelector('.duration-summary');if(summary)summary.textContent=S.time;
      const confirm=document.querySelector('.duration-confirm');if(confirm)confirm.disabled=false;
    }
  }
  function syncDurationWheels(){
    requestAnimationFrame(()=>{
      [['hours',S.customHours||0],['minutes',S.customMinutes||15]].forEach(([unit,value])=>{
        const wheel=document.querySelector(`.duration-wheel[data-unit="${unit}"]`);if(!wheel)return;
        const buttons=[...wheel.querySelectorAll('.duration-wheel-item')];
        const index=buttons.findIndex(button=>Number(button.dataset.value)===Number(value));
        if(index<0)return;
        wheel.scrollTo({top:index*buttons[0].offsetHeight,behavior:'smooth'});
        buttons.forEach((button,i)=>button.classList.toggle('active',i===index));
      });
      const summary=document.querySelector('.duration-summary');if(summary)summary.textContent=durationLabel();
    });
  }
  function selectResetJournalPhoto(input){
    const file=input.files&&input.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=event=>{S.resetJournalPhoto=event.target.result;render()};
    reader.readAsDataURL(file);
  }
  function saveResetJournalMemory(){
    const note=(S.resetJournalNote||'A quiet moment to slow down and recharge.').trim();
    S.memories.unshift({name:'Tea & Breathe',date:'Today',note});
    S.saved=true;
    toast('Saved to your Journal');
    go('reflection');
  }
  render=function(){
    const x=S.screen;
    if(!['time','duration','mood','ready','instructions','journalphoto','reflection','complete'].includes(x))return renderBeforeResetFlow();

      if(S.time==='Choose your own time'){S.customHours=S.customHours??0;S.customMinutes=S.customMinutes??15;S.time=durationLabel()}

      body=`${resetHead("go('time')",'1 of 3',1)}<span class="reset-kicker">choose duration</span><h1>Give yourself<br>the time you have.</h1><p class="flow-copy">Scroll with your finger to set a duration.</p><div class="duration-picker" aria-label="Duration picker">${durationWheel('hours',[0,1,2,3,4],'hr',S.customHours)}${durationWheel('minutes',[0,15,30,45],'min',S.customMinutes)}</div><p class="duration-summary">${durationLabel()}</p><div class="flow-actions duration-actions"><button class="flow-primary duration-confirm" onclick="go('mood')">Confirm</button></div>`;
      requestAnimationFrame(syncDurationWheels);
    }
    else if(x==='mood')body=`${resetHead("go('time')",'2 of 3',2)}<h1>How do you feel<br>right now?</h1><p class="flow-copy">Choose what feels closest.</p><div class="flow-options">${['My mind feels busy','I feel low on energy','I feel stressed','I need fresh air','I want to move my body'].map(z=>flowOption(z,'',S.mood===z,`S.mood='${z}';render()`)).join('')}</div><div class="flow-actions"><button class="flow-primary" ${!S.mood?'disabled':''} onclick="go('ready')">Next</button></div>`;
    else if(x==='ready')body=`<div class="reset-ready">${resetHead("go('mood')",'3 of 3',3)}<h1>Your Reset is ready</h1><div class="reset-art"><i class="reset-steam"></i><i class="reset-branches"></i></div><section class="reset-card"><span class="reset-kicker">today's reset</span><button class="heart" aria-label="Save reset">♡</button><h2>Tea &amp; Breathe</h2><p>A quiet moment to slow down and recharge.</p><span class="duration">${(S.time||'10 min').replace(' min','')} minutes</span></section><div class="flow-actions"><button class="flow-primary" onclick="go('instructions')">Start</button><button class="flow-secondary" onclick="S.time='';S.mood='';go('time')">Try another</button></div></div>`;
    else if(x==='instructions')body=`${resetHead("go('ready')",'Tea & Breathe',3)}<span class="reset-kicker">your reset</span><h1>Take this moment<br>for yourself.</h1><p class="flow-copy">Move through these steps slowly, at your own pace.</p><div class="instruction-panel">${['Make a warm drink you enjoy.','Sit somewhere comfortable.','Take five slow breaths.','Notice one small thing that feels good.'].map(t=>`<div class="instruction"><span>${t}</span></div>`).join('')}</div><p class="instruction-support">Take this moment for yourself.</p><div class="instruction-breath-zone"><div class="instruction-breath" aria-label="Animated WIMB breathing mascot" role="img"><img src="${journalMascots.calendar}" alt=""></div></div><div class="flow-actions"><button class="flow-primary" onclick="go('journalphoto')">Next</button><button class="flow-link" onclick="go('reflection')">Skip</button></div>`;
    else if(x==='journalphoto')body=`<section class="journal-photo-screen"><div class="reset-top"><button class="reset-back" aria-label="Back to instructions" onclick="go('instructions')">‹</button><span></span><span></span></div><h1>Tea &amp; Breathe</h1><p class="flow-copy">Save this moment so you can remember what helped you to feel better.</p><label class="journal-photo-upload ${S.resetJournalPhoto?'has-photo':''}">${S.resetJournalPhoto?`<img src="${S.resetJournalPhoto}" alt="Selected moment">`:`<img class="upload-symbol" src="https://www.figma.com/api/mcp/asset/5d4b7252-9108-49b0-aae1-3cbf3fde032d.svg" alt=""><strong>The moments you want<br>to keep close.</strong><small>Take a photo</small>`}<input type="file" accept="image/*" capture="environment" aria-label="Take a photo for your Journal" onchange="selectResetJournalPhoto(this)"></label><label class="journal-note-label">A NOTE FOR YOUR FUTURE SELF<textarea aria-label="A note for your future self" placeholder="How did this moment make you feel?" oninput="S.resetJournalNote=this.value">${S.resetJournalNote||''}</textarea></label><div class="journal-memory-caption"><span>Your moment, your memory</span><span>Tea &amp; Breathe</span></div><div class="flow-actions journal-photo-actions"><button class="flow-primary" onclick="saveResetJournalMemory()">Save to Journal</button><button class="flow-link" onclick="go('reflection')">Skip</button></div></section>`;
    else if(x==='reflection'){
      const feedback={
        'Yes, it helped':'You showed up for yourself today.',
        'A little better':'Even a small shift matters.',
        'Not today':'That’s okay. Not every reset will fit every day.',
        'I want something different':'We’ll help you find something that fits better.'
      };
      body=`${resetHead("go('instructions')",'Reflection',3)}<span class="reset-kicker">almost done</span><h1>Did this Reset<br>help?</h1><p class="flow-copy">Your answer helps make the next one feel more personal.</p><div class="reflection-options">${['Yes, it helped','A little better','Not today','I want something different'].map(t=>`<button class="${S.reflect===t?'selected':''}" onclick="S.reflect=S.reflect==='${t}'?'':'${t}';render()">${t}</button>`).join('')}</div><div class="flow-actions"><button class="flow-primary" ${!S.reflect?'disabled':''} onclick="go('complete')">Finish</button>${S.reflect?`<p class="flow-link reflection-feedback">${feedback[S.reflect]}</p>`:`<button class="flow-link" onclick="go('complete')">Skip</button>`}</div>`;
    }
    else body=`${resetHead("go('reflection')",'Complete',3)}<div class="complete-visual" aria-label="Wind Mind completion"><i class="complete-form complete-form-a"></i><i class="complete-form complete-form-b"></i><i class="complete-form complete-form-c"></i><i class="complete-heart complete-heart-one" aria-hidden="true">♥</i><i class="complete-heart complete-heart-two" aria-hidden="true">♥</i><i class="complete-heart complete-heart-three" aria-hidden="true">♥</i><img class="complete-logo" src="https://www.figma.com/api/mcp/asset/f3517cb0-bca0-4273-95f0-fe90a32b00aa.svg" alt="Wind Mind"></div><div class="complete-copy"><span class="reset-kicker">you showed up</span><h1>Your Reset<br>is complete!</h1><p class="flow-copy">A small pause can make a big difference.</p></div><div class="flow-actions"><button class="flow-primary" onclick="go('home')">Back to Home</button><button class="flow-secondary" onclick="go('journal')">View in Journal</button></div>`;
    $('#root').innerHTML=`<section class="reset-screen reset-${x}">${body}</section>`;
  };
  render();
</script>

      document.querySelector('.page')?.classList.add('wimb-onboarding-page');
    }
    if(S.screen==='onquestion') document.querySelector('.page')?.classList.add('wimb-question-page');
  };
  render();

<script>
  /* Preview-only deep link for reviewing the existing onboarding questions. */
  const wimbPreviewScreen=new URLSearchParams(location.search).get('screen');
  if(wimbPreviewScreen==='questions'){
    S.screen='onquestion';
    render();
  }
  if(wimbPreviewScreen==='ready'){
    S.time='10 min';
    S.screen='ready';
    render();
  }
  if(wimbPreviewScreen==='reflection'){
    S.screen='reflection';
    render();
  }
  if(wimbPreviewScreen==='complete'){
    S.screen='complete';
    render();
  }

<script>
  /* Navigation has one active-tab source and one measured position shared by pill and wave. */
  const wimbNavTabs=[
    {id:'home',route:'home',label:'Home',icon:()=>navIcon.home},
    {id:'reset',route:'time',label:'Find my Reset',icon:()=>navIcon.reset},
    {id:'camera',route:'memory',label:'Make a memory',icon:()=>navIcon.camera},
    {id:'journal',route:'journal',label:'Journal',icon:()=>navIcon.journal},
    {id:'profile',route:'profile',label:'Profile',icon:()=>navIcon.profile}
  ];
  function wimbTabForScreen(screen){
    if(['journal','memorydetail','activity'].includes(screen))return 'journal';
    if(['profile','history','activities','preferences'].includes(screen))return 'profile';
    if(['memory'].includes(screen))return 'camera';
    if(['time','duration','mood','ready','instructions','journalphoto','reflection','complete'].includes(screen))return 'reset';
    return 'home';
  }
  function wimbSyncNav(navEl){
    if(!navEl)return;
    const active=navEl.querySelector('button.on')||navEl.querySelector('button[data-nav-tab]');
    if(!active)return;
    const navBox=navEl.getBoundingClientRect(),buttonBox=active.getBoundingClientRect();
    const targetX=buttonBox.left-navBox.left+buttonBox.width/2;
    const pendingX=window.wimbNavPendingX;
    if(typeof pendingX==='number'&&!navEl.dataset.motionStarted){
      navEl.dataset.motionStarted='true';
      navEl.style.setProperty('--nav-active-x',`${pendingX}px`);
      navEl.style.setProperty('--nav-indicator-stretch','1.15');
      window.wimbNavPendingX=null;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        navEl.style.setProperty('--nav-active-x',`${targetX}px`);
        navEl.style.setProperty('--nav-indicator-stretch','1.035');
        active.classList.add('nav-arriving');
        setTimeout(()=>navEl.style.setProperty('--nav-indicator-stretch','1'),420);
      }));
      return;
    }
    navEl.style.setProperty('--nav-active-x',`${targetX}px`);
  }
  nav=function(on='home'){
    const active=S.activeTab||on;
    return `<div class="wimb-status" aria-label="Device status"><span>01:24</span><span class="wimb-status-signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="wimb-status-battery" aria-hidden="true"></span></div><nav class="nav glass" aria-label="Main navigation" data-active-tab="${active}"><span class="nav-active-wave" aria-hidden="true"></span><span class="nav-active-indicator" aria-hidden="true"></span>${wimbNavTabs.map(tab=>`<button class="${active===tab.id?'on':''}" data-nav-tab="${tab.id}" aria-label="${tab.label}" aria-current="${active===tab.id?'page':'false'}" onclick="navigateFromNav('${tab.route}','${tab.id}',event)">${tab.icon()}</button>`).join('')}</nav>`;
  };
  function navigateFromNav(route,tabId,event){
    const navEl=event.currentTarget.closest('.nav');

    S.activeTab=tabId;
    go(route);
  }

    wimbGo(screen);

  wimbGo(S.screen);
  requestAnimationFrame(()=>wimbSyncNav(document.querySelector('.nav')));

  .camera-memory{position:relative}.camera-memory .camera-memory-meta{position:absolute;right:10px;bottom:10px;left:10px;padding:8px 10px;border-radius:12px;background:rgba(6,19,21,.62);color:var(--wimb-t50);font-size:11px;text-align:left;backdrop-filter:blur(7px)}
  @media(prefers-reduced-motion:reduce){.camera-overlay,.camera-sheet{animation:none!important}}
</style>
<script>
  let navCameraStream=null,navCameraRequest=0;
  function cameraOverlay(){return document.querySelector('.camera-overlay')}
  function stopNavCamera(){
    if(navCameraStream){navCameraStream.getTracks().forEach(track=>track.stop());navCameraStream=null}
    const video=document.querySelector('.camera-stage video');if(video)video.srcObject=null;
  }
  function cameraFallbackMarkup(){return `<label class="camera-fallback"><strong>Open your device camera</strong><span>Camera access is unavailable here. Choose the camera below.</span><span class="camera-fallback-button">Take photo</span><input type="file" accept="image/*" capture="environment" aria-label="Take photo"></label>`}
  function openNavCamera(){
    closeNavCamera();
    S.cameraPhoto='';S.cameraNote='';S.cameraNoteOpen=false;
    const overlay=document.createElement('div');overlay.className='camera-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Camera capture');
    overlay.innerHTML=`<section class="camera-sheet"><header class="camera-head"><button class="camera-close" data-camera-action="close" aria-label="Cancel camera">×</button><h2>Capture a moment</h2><span></span></header><div class="camera-stage"><video autoplay playsinline muted aria-label="Live camera view"></video></div><button class="camera-capture" data-camera-action="capture" aria-label="Take photo">Take photo</button></section>`;
    overlay.addEventListener('click',event=>{
      const control=event.target.closest('[data-camera-action]');if(!control)return;
      const actions={close:closeNavCamera,capture:captureNavCamera,note:openNavCameraNote,again:againNavCamera,save:saveNavCameraMemory};
      actions[control.dataset.cameraAction]?.();
    });
    overlay.addEventListener('change',event=>{if(event.target.matches('input[type="file"]'))navCameraFileSelected(event.target)});
    document.querySelector('.app').appendChild(overlay);
    startNavCamera();
  }
  async function startNavCamera(){
    stopNavCamera();
    const requestId=++navCameraRequest;
    const stage=document.querySelector('.camera-stage');if(!stage)return;
    stage.innerHTML='<video autoplay playsinline muted aria-label="Live camera view"></video>';
    const capture=document.querySelector('.camera-capture');if(capture)capture.hidden=false;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){stage.innerHTML=cameraFallbackMarkup();if(capture)capture.hidden=true;return}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      if(requestId!==navCameraRequest||!cameraOverlay()){stream.getTracks().forEach(track=>track.stop());return}
      navCameraStream=stream;
      const video=stage.querySelector('video');if(!video){stopNavCamera();return}video.srcObject=navCameraStream;
      await Promise.race([video.play().catch(()=>{}),new Promise(resolve=>setTimeout(resolve,2500))]);
      if(!video.videoWidth)throw new Error('Camera preview unavailable');
    }catch(error){stopNavCamera();stage.innerHTML=cameraFallbackMarkup();if(capture)capture.hidden=true}
  }
  function captureNavCamera(){
    const video=document.querySelector('.camera-stage video');if(!video||!video.videoWidth)return;
    const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);S.cameraPhoto=canvas.toDataURL('image/jpeg',.9);stopNavCamera();showNavCameraPreview();
  }
  function navCameraFileSelected(input){
    const file=input.files&&input.files[0];if(!file)return;
    const reader=new FileReader();reader.onload=event=>{S.cameraPhoto=event.target.result;showNavCameraPreview()};reader.readAsDataURL(file);
  }
  function showNavCameraPreview(){
    stopNavCamera();const sheet=document.querySelector('.camera-sheet');if(!sheet||!S.cameraPhoto)return;
    sheet.innerHTML=`<header class="camera-head"><button class="camera-close" data-camera-action="close" aria-label="Cancel camera">×</button><h2>Your moment</h2><span></span></header><div class="camera-stage"><img class="camera-preview" src="${S.cameraPhoto}" alt="Captured moment"></div><label class="camera-note" ${S.cameraNoteOpen?'':'hidden'}>HOW DID THIS MOMENT MAKE YOU FEEL?<textarea placeholder="How did this moment make you feel?">${esc(S.cameraNote||'')}</textarea></label><div class="camera-actions"><button class="camera-save" data-camera-action="save">Save</button><button data-camera-action="note">Add note</button><button data-camera-action="again">Again</button></div>`;
    const note=sheet.querySelector('textarea');if(note)note.addEventListener('input',event=>{S.cameraNote=event.target.value});
    if(S.cameraNoteOpen)requestAnimationFrame(()=>sheet.querySelector('textarea')?.focus());
  }
  function openNavCameraNote(){S.cameraNoteOpen=true;showNavCameraPreview()}
  function againNavCamera(){S.cameraPhoto='';S.cameraNote='';S.cameraNoteOpen=false;const sheet=document.querySelector('.camera-sheet');if(!sheet)return;sheet.innerHTML=`<header class="camera-head"><button class="camera-close" data-camera-action="close" aria-label="Cancel camera">×</button><h2>Capture a moment</h2><span></span></header><div class="camera-stage"><video autoplay playsinline muted aria-label="Live camera view"></video></div><button class="camera-capture" data-camera-action="capture" aria-label="Take photo">Take photo</button>`;startNavCamera()}
  function saveNavCameraMemory(){
    if(!S.cameraPhoto)return;
    const now=new Date(),activity=S.time?'Tea & Breathe':'A mindful moment';
    S.memories.unshift({name:activity,reset:activity,date:'Today',dateTime:now.toISOString(),duration:S.time||'',note:(S.cameraNote||'').trim(),photo:S.cameraPhoto});
    closeNavCamera();toast('Saved to your Journal');if(S.screen==='journal'&&S.journal==='gallery')render();
  }
  function closeNavCamera(){navCameraRequest++;stopNavCamera();const overlay=cameraOverlay();if(overlay)overlay.remove();S.cameraPhoto='';S.cameraNote='';S.cameraNoteOpen=false}
  Object.assign(window,{openNavCamera,closeNavCamera,captureNavCamera,navCameraFileSelected,openNavCameraNote,againNavCamera,saveNavCameraMemory});
  window.addEventListener('pagehide',stopNavCamera);
  const cameraGalleryBefore=render;
  render=function(){
    cameraGalleryBefore();
    if(S.screen!=='journal'||S.journal!=='gallery')return;
    const gallery=document.querySelector('.journal-gallery');if(!gallery)return;
    const captured=S.memories.filter(memory=>memory.photo);if(!captured.length)return;
    const tabs=gallery.querySelector('.tabs');if(!tabs)return;
    const group=document.createElement('section');group.className='gallery-group camera-gallery-group';
    group.innerHTML=`<div class="gallery-label">CAPTURED MOMENTS</div><div class="masonry"><div class="masonry-col">${captured.filter((_,i)=>i%2===0).map(memory=>`<div class="gallery-photo medium camera-memory"><img src="${memory.photo}" alt="${esc(memory.name||'Journal memory')}"><span class="camera-memory-meta">${esc(memory.note||memory.name||'Journal memory')}</span></div>`).join('')}</div><div class="masonry-col">${captured.filter((_,i)=>i%2===1).map(memory=>`<div class="gallery-photo medium camera-memory"><img src="${memory.photo}" alt="${esc(memory.name||'Journal memory')}"><span class="camera-memory-meta">${esc(memory.note||memory.name||'Journal memory')}</span></div>`).join('')}</div></div>`;
    tabs.insertAdjacentElement('afterend',group);
  };
  render();
</script>
<style>
  /* Approved action-button color update: mascot Orange 300 with controlled Liquid Glass depth. Navigation is intentionally excluded. */

  .home-ref .start,

  .wimb-question-page .footer .btn:not(.alt),

    border-color:rgba(254,241,239,.58)!important;

      inset 0 -7px 12px rgba(106,37,25,.18),

  }
  .btn:not(.alt),.home-ref .start,.flow-primary,.wimb-question-page .footer .btn:not(.alt),.camera-fallback-button,.camera-capture,.camera-actions .camera-save{color:#fff!important}
  .btn:not(.alt),.flow-primary,.wimb-question-page .footer .btn:not(.alt),.camera-fallback-button,.camera-capture,.camera-actions .camera-save,#root .cal-activity .activity-action,.memory-detail .memory-reset-card .activity-action{position:relative;isolation:isolate;overflow:hidden}
  .btn:not(.alt):after,.flow-primary:after,.wimb-question-page .footer .btn:not(.alt):after,.camera-fallback-button:after,.camera-capture:after,.camera-actions .camera-save:after,#root .cal-activity .activity-action:after,.memory-detail .memory-reset-card .activity-action:after{

      radial-gradient(ellipse at 28% 16%,rgba(255,255,255,.62),transparent 39%),
      radial-gradient(ellipse at 82% 82%,rgba(248,159,143,.26),transparent 55%)!important;
    border:1px solid rgba(255,232,219,.56)!important;
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,.55),
      inset 0 -7px 12px rgba(106,37,25,.18),
      0 4px 12px rgba(227,92,46,.25),
      0 0 13px rgba(248,159,143,.14)!important;
  }
  .home-ref .start:after{
    content:"";
    position:absolute;
    z-index:-1;

  }
  #root .reset-reflection .reflection-feedback{
    font-family:"Lora",serif!important;
    font-style:italic;
    font-weight:400;
  }
  /* Readability rule: glass refraction stays behind all card content. */
  .glass{isolation:isolate}
  .glass:after{z-index:0}
  .glass>*{position:relative;z-index:1}
  .home-ref .quick b,.home-ref .quick small{opacity:1;filter:none;text-shadow:none}

<script>
  /* Quick Resets bypass the questionnaire and open a focused suggestion without progress UI. */
  const quickResetContent={
    tea:{title:'Tea & Breathe',duration:'15 minutes',description:'A quiet moment to slow down and recharge.',steps:['Make a warm drink you enjoy.','Sit somewhere comfortable.','Take five slow breaths.','Notice one small thing that feels good.']},
    exercise:{title:'Gentle Movement',duration:'10 minutes',description:'A short movement break to wake up your body and restore your energy.',steps:['Stand tall and relax your shoulders.','Roll your shoulders slowly five times in each direction.','March gently in place for one minute.','Stretch both arms overhead, then release slowly.']},
    breathe:{title:'Calm Breathing',duration:'5 minutes',description:'A simple breathing pause to help your mind and body settle.',steps:['Sit comfortably and soften your shoulders.','Breathe in slowly through your nose for four counts.','Breathe out gently for six counts.','Repeat the slow breathing cycle five times.']}
  };
  function openQuickReset(kind){S.quickReset=kind;S.screen='quickready';render()}
  function quickResetHeader(back,title){return `<div class="reset-top"><button class="reset-back" aria-label="Back" onclick="${back}">‹</button><span class="reset-count">${title}</span><span></span></div>`}
  const renderBeforeQuickResets=render;
  render=function(){
    const x=S.screen;
    if(x==='quickready'||x==='quickinstructions'){
      const item=quickResetContent[S.quickReset]||quickResetContent.tea;
      let body='';
      if(x==='quickready'){
        body=`<div class="reset-ready quick-reset-ready">${quickResetHeader("go('home')",item.title)}<h1>Your Reset is ready</h1><div class="reset-art"><i class="reset-steam"></i><i class="reset-branches"></i></div><section class="reset-card"><span class="reset-kicker">quick reset</span><h2>${item.title}</h2><p>${item.description}</p><span class="duration">${item.duration}</span></section><div class="flow-actions"><button class="flow-primary" onclick="go('quickinstructions')">Start</button><button class="flow-secondary" onclick="go('home')">Try another</button></div></div>`;
      }else{
        body=`${quickResetHeader("go('quickready')",item.title)}<span class="reset-kicker">your reset</span><h1>${S.quickReset==='exercise'?'Move your body<br>with care.':S.quickReset==='breathe'?'Breathe slowly<br>and settle in.':'Take this moment<br>for yourself.'}</h1><p class="flow-copy">Move through these steps slowly, at your own pace.</p><div class="instruction-panel">${item.steps.map(t=>`<div class="instruction"><span>${t}</span></div>`).join('')}</div><p class="instruction-support">Take this moment for yourself.</p><div class="instruction-breath-zone"><div class="instruction-breath" aria-label="Animated WIMB reset mascot" role="img"><img src="${journalMascots.calendar}" alt=""></div></div><div class="flow-actions"><button class="flow-primary" onclick="go('reflection')">Finish</button><button class="flow-link" onclick="go('home')">Skip</button></div>`;
      }
      $('#root').innerHTML=`<section class="reset-screen reset-${x} ${x==='quickinstructions'?'reset-instructions':''}">${body}</section>`;
      return;
    }
    renderBeforeQuickResets();
    if(S.screen==='home'){
      const mainStart=document.querySelector('.home-ref .start');
      if(mainStart)mainStart.onclick=()=>{S.quickReset='';go('time')};
      const cards=document.querySelectorAll('.home-ref .quick');
      if(cards[0])cards[0].onclick=()=>openQuickReset('tea');
      if(cards[1])cards[1].onclick=()=>openQuickReset('exercise');
      if(cards[2])cards[2].onclick=()=>openQuickReset('breathe');
    }
    if(S.screen==='reflection'&&S.quickReset){
      const back=document.querySelector('.reset-back');
      if(back)back.onclick=()=>go('quickinstructions');
    }
  };
  Object.assign(window,{openQuickReset});
  render();
</script>
