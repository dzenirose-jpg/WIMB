<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<style>
  .bg{fill:#F3F0EA}.phone{fill:#FFFDF8;stroke:#252525;stroke-width:4}.rule{stroke:#252525;stroke-width:2}.soft{fill:#E5E8DC}.dark{fill:#33433A}.card{fill:#fff;stroke:#252525;stroke-width:2}.muted{fill:#696969}.title{font:700 20px Arial,sans-serif;fill:#252525}.h{font:700 25px Arial,sans-serif;fill:#252525}.body{font:15px Arial,sans-serif;fill:#555}.small{font:13px Arial,sans-serif;fill:#555}.button{font:700 14px Arial,sans-serif;fill:white}.label{font:700 15px Arial,sans-serif;fill:#625F59}.q{font:700 14px Arial,sans-serif;fill:#252525}.num{font:700 13px Arial,sans-serif;fill:#252525}
</style>
<rect class="bg" width="1600" height="1050"/><text x="62" y="62" class="title">AFTER-WORK RESET · MOBILE APP WIREFRAME</text><text x="62" y="88" class="body">Check-in → personal activity → guided moment → memory → future preferences</text>
<!-- 1 --> <text x="80" y="145" class="label">1 · WELCOME</text><rect x="70" y="160" width="260" height="510" rx="28" class="phone"/><rect x="155" y="180" width="90" height="5" rx="3" fill="#252525"/><circle cx="200" cy="330" r="65" class="soft"/><text x="184" y="348" font-size="48">☀</text><text x="119" y="430" class="small">AFTER-WORK RESET</text><text x="104" y="468" class="h">A small moment</text><text x="151" y="497" class="h">for you.</text><text x="105" y="535" class="body">Would you like to check in now?</text><rect x="92" y="580" width="216" height="46" rx="11" class="dark"/><text x="146" y="609" class="button">START CHECK-IN</text><text x="169" y="651" class="small">Skip for now</text>
<!-- 2 --> <text x="435" y="145" class="label">2 · CHECK-IN</text><rect x="425" y="160" width="260" height="510" rx="28" class="phone"/><rect x="510" y="180" width="90" height="5" rx="3" fill="#252525"/><rect x="448" y="213" width="62" height="5" rx="3" class="dark"/><rect x="518" y="213" width="62" height="5" rx="3" fill="#DDD"/><rect x="588" y="213" width="62" height="5" rx="3" fill="#DDD"/><text x="449" y="257" class="small">QUESTION 1 OF 3</text><text x="449" y="297" class="h">How much time</text><text x="449" y="325" class="h">do you have?</text><text x="449" y="352" class="small">We’ll fit the idea to your day.</text><rect x="449" y="380" width="212" height="48" rx="10" class="card"/><text x="466" y="410" class="q">5–10 minutes</text><rect x="449" y="440" width="212" height="48" rx="10" class="card"/><text x="466" y="470" class="q">15–30 minutes</text><rect x="449" y="500" width="212" height="48" rx="10" class="card"/><text x="466" y="530" class="q">More than 30 minutes</text><rect x="449" y="580" width="212" height="46" rx="11" class="dark"/><text x="530" y="609" class="button">NEXT</text>
<!-- 3 --> <text x="790" y="145" class="label">3 · HOW DO YOU FEEL?</text><rect x="780" y="160" width="260" height="510" rx="28" class="phone"/><rect x="865" y="180" width="90" height="5" rx="3" fill="#252525"/><rect x="803" y="213" width="62" height="5" rx="3" class="dark"/><rect x="873" y="213" width="62" height="5" rx="3" class="dark"/><rect x="943" y="213" width="62" height="5" rx="3" fill="#DDD"/><text x="803" y="257" class="small">QUESTION 2 OF 3</text><text x="803" y="297" class="h">How are you</text><text x="803" y="325" class="h">feeling today?</text><rect x="803" y="360" width="212" height="46" rx="10" class="card"/><text x="819" y="389" class="q">😴  Tired / low energy</text><rect x="803" y="416" width="212" height="46" rx="10" class="card"/><text x="819" y="445" class="q">😣  Stressed</text><rect x="803" y="472" width="212" height="46" rx="10" class="card"/><text x="819" y="501" class="q">🙂  I want to enjoy myself</text><rect x="803" y="528" width="212" height="46" rx="10" class="card"/><text x="819" y="557" class="q">⚡  Full of energy</text><rect x="803" y="580" width="212" height="46" rx="11" class="dark"/><text x="884" y="609" class="button">NEXT</text>
<!-- 4 --> <text x="1145" y="145" class="label">4 · YOUR SUGGESTION</text><rect x="1135" y="160" width="260" height="510" rx="28" class="phone"/><rect x="1220" y="180" width="90" height="5" rx="3" fill="#252525"/><text x="1158" y="238" class="small">YOUR RESET · 20 MIN</text><text x="1158" y="278" class="h">Ride slowly and</text><text x="1158" y="306" class="h">notice the sky.</text><text x="1352" y="239" font-size="25">♡</text><rect x="1158" y="332" width="214" height="90" rx="13" class="card"/><text x="1173" y="360" class="q">🚲  Mini cycling reset</text><text x="1173" y="386" class="small">No destination. Choose a safe,</text><text x="1173" y="405" class="small">easy route and take it slowly.</text><rect x="1158" y="440" width="214" height="90" rx="12" class="soft"/><text x="1171" y="465" class="small">Why this idea?</text><text x="1171" y="485" class="small">You have time and want to enjoy</text><text x="1171" y="504" class="small">the moment — movement + nature.</text><rect x="1158" y="580" width="214" height="46" rx="11" class="dark"/><text x="1244" y="609" class="button">START</text>
<!-- 5 --> <text x="80" y="740" class="label">5 · GUIDED ACTIVITY</text><rect x="70" y="755" width="360" height="250" rx="28" class="phone"/><rect x="205" y="775" width="90" height="5" rx="3" fill="#252525"/><text x="95" y="820" class="small">STEP 1 OF 3</text><text x="95" y="858" class="h">Give yourself permission to enjoy.</text><circle cx="109" cy="893" r="13" class="card"/><text x="105" y="898" class="num">1</text><text x="135" y="890" class="q">Ride slowly.</text><text x="135" y="910" class="small">You do not need to get anywhere.</text><circle cx="109" cy="940" r="13" class="card"/><text x="105" y="945" class="num">2</text><text x="135" y="937" class="q">Take a photo of the sky.</text><text x="135" y="957" class="small">Notice its colours, light or clouds.</text><circle cx="109" cy="987" r="13" class="card"/><text x="105" y="992" class="num">3</text><text x="135" y="984" class="q">Pause for 10 minutes.</text><text x="135" y="1004" class="small">Breathe. Look at nature. Observe around you.</text>
<!-- 6 --> <text x="535" y="740" class="label">6 · MAKE A MEMORY</text><rect x="525" y="755" width="300" height="250" rx="28" class="phone"/><rect x="630" y="775" width="90" height="5" rx="3" fill="#252525"/><text x="550" y="820" class="small">YOUR MOMENT</text><text x="550" y="858" class="h">Save a memory.</text><text x="550" y="880" class="small">A photo or note is enough.</text><rect x="550" y="897" width="250" height="48" rx="10" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 5"/><text x="624" y="927" class="q">＋ Add a photo</text><rect x="550" y="955" width="118" height="34" rx="9" class="card"/><text x="566" y="977" class="small">♡ Save for later</text><rect x="678" y="955" width="122" height="34" rx="9" class="dark"/><text x="690" y="977" class="button">MAKE MEMORY</text>
<!-- 7 --> <text x="930" y="740" class="label">7 · FEEDBACK FOR NEXT TIME</text><rect x="920" y="755" width="300" height="250" rx="28" class="phone"/><rect x="1025" y="775" width="90" height="5" rx="3" fill="#252525"/><text x="945" y="820" class="small">A QUICK QUESTION</text><text x="945" y="858" class="h">Was this useful?</text><text x="945" y="880" class="small">Your answer shapes future suggestions.</text><rect x="945" y="897" width="250" height="30" rx="8" class="card"/><text x="960" y="917" class="small">Yes, suggest similar ideas</text><rect x="945" y="935" width="250" height="30" rx="8" class="card"/><text x="960" y="955" class="small">Maybe another time</text><rect x="945" y="973" width="250" height="30" rx="8" class="card"/><text x="960" y="993" class="small">No, I want different suggestions</text>
</svg>
